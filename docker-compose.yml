services:
  # WildFly com EAR Application
  wildfly:
    build:
      context: .
      dockerfile: ./ear-module/Dockerfile
    container_name: wildfly
    ports:
      - "8081:8080"
      - "9990:9990"
    environment:
      - WILDFLY_ADMIN_USER=admin
      - WILDFLY_ADMIN_PASSWORD=admin
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/beneficio-api/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Nginx com Frontend Angular + Reverse Proxy
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "8082:80"
    depends_on:
      - wildfly
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
