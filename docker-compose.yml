version: '3.8'

services:
  # H2 Database for development
  h2-database:
    image: h2database/h2:latest
    container_name: bip-h2-database
    ports:
      - "8082:8082"
    environment:
      - H2_OPTIONS=-web -webAllowOthers -tcp -tcpAllowOthers -browser
    volumes:
      - h2-data:/opt/h2-data
    networks:
      - bip-network

  # Backend Spring Boot Application
  backend:
    build:
      context: ./backend-module
      dockerfile: Dockerfile
    container_name: bip-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:h2:tcp://h2-database:8082/./data/bip
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
    depends_on:
      - h2-database
    networks:
      - bip-network
    volumes:
      - ./backend-module/target:/app/target

  # Frontend Angular Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bip-frontend
    ports:
      - "4200:4200"
    environment:
      - API_URL=http://localhost:8080/api/v1
    depends_on:
      - backend
    networks:
      - bip-network
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/angular.json:/app/angular.json
      - ./frontend/package.json:/app/package.json

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: bip-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - bip-network

volumes:
  h2-data:

networks:
  bip-network:
    driver: bridge
