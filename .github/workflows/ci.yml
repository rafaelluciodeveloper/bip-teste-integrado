name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Test Backend Module
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build and test ejb-module
      run: |
        cd ejb-module
        mvn clean compile test
        
    - name: Build and test backend-module
      run: |
        cd backend-module
        mvn clean compile test

  test-frontend:
    name: Test Frontend Module
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Lint code
      run: |
        cd frontend
        npm run lint
        
    - name: Run tests
      run: |
        cd frontend
        npm run test -- --coverage --watchAll=false
        
    - name: Build application
      run: |
        cd frontend
        npm run build

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build EJB module
      run: |
        cd ejb-module
        mvn clean package -DskipTests
        
    - name: Build Backend module
      run: |
        cd backend-module
        mvn clean package -DskipTests
        
    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build Frontend
      run: |
        cd frontend
        npm run build
        
    - name: Run integration tests
      run: |
        echo "Integration tests would run here"
        # Add integration test commands when available

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'bip-teste-integrado'
        path: '.'
        format: 'HTML'
        out: 'dependency-check-report'
        
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: dependency-check-report/

  build-artifacts:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, integration-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build EJB JAR
      run: |
        cd ejb-module
        mvn clean package -DskipTests
        
    - name: Build Backend JAR
      run: |
        cd backend-module
        mvn clean package -DskipTests
        
    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build
        
    - name: Upload EJB artifact
      uses: actions/upload-artifact@v3
      with:
        name: ejb-module-jar
        path: ejb-module/target/*.jar
        
    - name: Upload Backend artifact
      uses: actions/upload-artifact@v3
      with:
        name: backend-module-jar
        path: backend-module/target/*.jar
        
    - name: Upload Frontend build
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: frontend/dist/

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-scan]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        echo "Checking test results..."
        echo "Backend tests: ${{ needs.test-backend.result }}"
        echo "Frontend tests: ${{ needs.test-frontend.result }}"
        echo "Security scan: ${{ needs.security-scan.result }}"
        
    - name: Quality Gate Status
      run: |
        if [[ "${{ needs.test-backend.result }}" == "success" && "${{ needs.test-frontend.result }}" == "success" ]]; then
          echo "✅ Quality Gate: PASSED"
          echo "All tests passed successfully"
        else
          echo "❌ Quality Gate: FAILED"
          echo "Some tests failed"
          exit 1
        fi