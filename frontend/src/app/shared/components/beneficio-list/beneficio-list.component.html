<div class="beneficio-list">
  <!-- Loading State -->
  @if (loading) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Carregando...</span>
      </div>
      <p class="mt-3 text-muted">Carregando benefícios...</p>
    </div>
  }

  <!-- Empty State -->
  @if (!loading && beneficios.length === 0) {
    <div class="text-center py-5">
      <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
      <h5 class="text-muted">Nenhum benefício encontrado</h5>
      <p class="text-muted">Não há benefícios cadastrados no sistema.</p>
    </div>
  }

  <!-- Benefits Grid -->
  @if (!loading && beneficios.length > 0) {
    <div class="row g-4">
      @for (beneficio of beneficios; track beneficio.id) {
        <div class="col-md-6 col-lg-4">
          <app-beneficio-card 
            [beneficio]="beneficio"
            [showActions]="showActions"
            (edit)="onEdit($event)"
            (delete)="onDelete($event)"
            (transfer)="onTransfer($event)">
          </app-beneficio-card>
        </div>
      }
    </div>
  }
</div>
