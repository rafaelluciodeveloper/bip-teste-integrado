<div class="card h-100 shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="card-title mb-0">{{ beneficio.nome }}</h5>
    <span class="badge" [ngClass]="beneficio.ativo ? 'bg-success' : 'bg-secondary'">
      {{ beneficio.ativo ? 'Ativo' : 'Inativo' }}
    </span>
  </div>
  <div class="card-body">
    <p class="card-text text-muted" *ngIf="beneficio.descricao">
      {{ beneficio.descricao }}
    </p>
    <div class="d-flex justify-content-between align-items-center">
      <span class="h5 text-primary mb-0">
        <i class="fas fa-dollar-sign me-1"></i>
        {{ beneficio.valor | currency:'BRL':'symbol':'1.2-2' }}
      </span>
      <small class="text-muted">
        ID: {{ beneficio.id }}
      </small>
    </div>
  </div>
  <div class="card-footer" *ngIf="showActions">
    <div class="btn-group w-100" role="group">
      <button type="button" class="btn btn-outline-primary btn-sm" (click)="onEdit()">
        <i class="fas fa-edit me-1"></i>
        Editar
      </button>
      <button type="button" class="btn btn-outline-success btn-sm" (click)="onTransfer()">
        <i class="fas fa-exchange-alt me-1"></i>
        Transferir
      </button>
      <button type="button" class="btn btn-outline-danger btn-sm" (click)="onDelete()">
        <i class="fas fa-trash me-1"></i>
        Excluir
      </button>
    </div>
  </div>
</div>
