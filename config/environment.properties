# Environment Configuration for BIP Teste Integrado

# Database Configuration
db.url=jdbc:h2:tcp://localhost:8082/./data/bip
db.driver=org.h2.Driver
db.username=sa
db.password=

# Backend Configuration
backend.port=8080
backend.host=localhost
spring.profiles.active=dev

# Frontend Configuration
frontend.port=4200
frontend.host=localhost
api.url=http://localhost:8080/api/v1

# H2 Database Configuration
h2.port=8082
h2.web.port=8082
h2.tcp.port=9092

# Docker Configuration
docker.compose.project.name=bip-teste-integrado
docker.network.name=bip-network

# CI/CD Configuration
github.token=${GITHUB_TOKEN}
sonar.token=${SONAR_TOKEN}
docker.registry=${DOCKER_REGISTRY}

# Security Configuration
jwt.secret=your-jwt-secret-key-here
jwt.expiration=86400000

# Logging Configuration
log.level=INFO
log.file=logs/application.log

# Monitoring Configuration
actuator.enabled=true
metrics.enabled=true
health.check.enabled=true
