# SonarQube Configuration for BIP Teste Integrado

# Project identification
sonar.projectKey=bip-teste-integrado
sonar.projectName=BIP Teste Integrado
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=backend-module/src/main/java,ejb-module/src/main/java,frontend/src
sonar.tests=backend-module/src/test/java,ejb-module/src/test/java,frontend/src

# Language settings
sonar.java.source=17
sonar.java.target=17

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=backend-module/target/site/jacoco/jacoco.xml,ejb-module/target/site/jacoco/jacoco.xml

# Test reports
sonar.junit.reportPaths=backend-module/target/surefire-reports,ejb-module/target/surefire-reports

# Exclusions
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/*.min.js,**/*.min.css

# Frontend specific
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Quality gate
sonar.qualitygate.wait=true
